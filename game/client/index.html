<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>풍운록</title>
  <style>
    :root { --ink: #f4ecd8; --panel: rgba(28, 22, 16, 0.92); --edge: #b8914a; --accent: #d8b25a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #120e0a; color: var(--ink);
      font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    #wrap { position: relative; width: 960px; height: 640px; margin: 16px auto; max-width: 100vw; }
    #game { display: block; width: 100%; height: auto; image-rendering: pixelated; border: 2px solid var(--edge); background: #000; }
    .panel { position: absolute; background: var(--panel); border: 2px solid var(--edge); border-radius: 4px; padding: 12px; }
    .hidden { display: none !important; }
    #login { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: radial-gradient(circle at 50% 40%, #3a2c1c, #120e0a 70%); border: none; }
    #login h1 { margin: 0; font-size: 56px; letter-spacing: 12px; color: var(--accent); text-shadow: 0 3px 0 #5a3a12; }
    #login p { margin: 0 0 12px; opacity: .8; }
    #login input, #login select, #login button, #chat-input { font: inherit; font-size: 16px; padding: 8px 10px;
      border: 2px solid var(--edge); background: #241c14; color: var(--ink); border-radius: 3px; }
    #login button { background: var(--edge); color: #1a120a; font-weight: 700; cursor: pointer; min-width: 200px; }
    #login-error { color: #ff8a80; min-height: 1.2em; }
    #chat-input { position: absolute; left: 12px; bottom: 12px; width: 420px; }
    #dialog { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 460px; }
    #dialog h3, #inventory h3 { margin: 0 0 8px; color: var(--accent); }
    #dialog .shop button, #dialog .close, #inventory button { font: inherit; background: #3a2c1c; color: var(--ink);
      border: 1px solid var(--edge); padding: 4px 8px; cursor: pointer; border-radius: 3px; }
    #dialog .shop { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 10px; align-items: center; margin: 10px 0; }
    #inventory { right: 12px; top: 120px; width: 300px; }
    #inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .slot { height: 50px; border: 1px solid #5a4a30; background: #1a140e; position: relative; cursor: pointer;
      display: flex; align-items: center; justify-content: center; }
    .slot canvas { width: 32px; height: 32px; image-rendering: pixelated; }
    .slot .qty { position: absolute; right: 2px; bottom: 0; font-size: 11px; }
    .slot:hover { outline: 1px solid var(--accent); }
    .help { font-size: 12px; opacity: .75; margin-top: 8px; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="640"></canvas>
    <div id="login" class="panel">
      <h1>풍운록</h1>
      <p>바람과 구름의 기록 — 고대 왕국의 사냥꾼이 되어 보시오</p>
      <input id="name" maxlength="12" placeholder="이름 (한글·영문 2~12자)" autocomplete="off" />
      <select id="job">
        <option value="warrior">전사 — 강인한 체력과 근접 공격</option>
        <option value="rogue">도적 — 치명적인 일격과 빠른 발</option>
        <option value="mage">주술사 — 원거리 화염과 광역 빙결</option>
        <option value="poet">도사 — 치유와 뇌격</option>
      </select>
      <button id="start">입장하기</button>
      <div id="login-error"></div>
    </div>
    <input id="chat-input" class="hidden" maxlength="200" placeholder="대화 입력 후 Enter (Esc 취소)" autocomplete="off" />
    <div id="dialog" class="panel hidden"></div>
    <div id="inventory" class="panel hidden">
      <h3>소지품 <span id="inv-gold"></span></h3>
      <div id="inv-weapon"></div>
      <div id="inv-grid"></div>
      <div class="help">클릭: 사용/장착 · 상점 대화 중 우클릭: 1개 판매</div>
    </div>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
